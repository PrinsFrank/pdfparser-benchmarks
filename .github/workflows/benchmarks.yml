name: Generate Benchmark Chart

on:
  schedule:
    - cron: '17 17 * * *'
      timezone: 'Europe/Amsterdam'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          ini-values: |
            opcache.enable=1
            opcache.enable_cli=1
            opcache.validate_timestamps=0
            opcache.jit=tracing
            opcache.jit_buffer_size=256M
            opcache.jit_hot_loop=32
            opcache.jit_hot_func=64
            opcache.jit_max_root_traces=4096
            opcache.jit_max_side_traces=512
            opcache.memory_consumption=512
            opcache.huge_code_pages=1
            opcache.interned_strings_buffers=16
            opcache.max_accelerated_files=20000

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --classmap-authoritative --no-dev

      - name: Run benchmark
        run: |
          ./run

      - name: check benchmarks
        run: |
          cat public/benchmarks_total.json
          jq -e '
            .["prinsfrank/pdfparser"].ms <= .["smalot/pdfparser"].ms and
            .["prinsfrank/pdfparser"].bytes <= .["smalot/pdfparser"].bytes and
            .["prinsfrank/pdfparser"].pass >= .["smalot/pdfparser"].pass
          ' public/benchmarks_total.json > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install plotly kaleido

      - name: Generate Graphs
        run: python generate-graphs.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          exclude_assets: '.gitignore'
